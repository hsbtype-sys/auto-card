<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>카드픽</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="카드픽">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#111827;--mut:#6b7280;--line:#e5e7eb;--pri:#2563eb;--ok:#059669;--warn:#d97706;--bad:#dc2626;--soft:#eef2ff}
@media(prefers-color-scheme:dark){:root{--bg:#0e1014;--card:#171a21;--tx:#f3f4f6;--mut:#9ca3af;--line:#282d38;--pri:#60a5fa;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--soft:#1e2433}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:19px;margin:4px 0 12px}
h2{font-size:15px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
input,select,button{font:inherit;color:inherit}
input[type=number],input[type=date],input[type=text],input[type=password],select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:var(--tx)}
.chk input{width:18px;height:18px;flex:none}
button{border:0;border-radius:10px;padding:9px 12px;background:var(--pri);color:#fff;cursor:pointer;font-weight:600}
button.ghost{background:transparent;color:var(--pri);border:1px solid var(--line)}
button.sm{padding:5px 9px;font-size:12px}
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top .in{max-width:560px;margin:0 auto;height:52px;padding:0 6px 0 16px;display:flex;align-items:center;justify-content:space-between}
.ttl{font-size:18px;font-weight:800;letter-spacing:-.3px}.home{background:transparent;color:inherit;padding:6px 6px;margin:-6px -6px;font:inherit;font-weight:800;letter-spacing:-.3px;border-radius:10px;-webkit-tap-highlight-color:transparent}
.home:active{background:var(--soft)}
.ttl small{font-size:12px;font-weight:600;color:var(--mut);margin-left:8px;letter-spacing:0}
.hb{width:44px;height:44px;padding:0;background:transparent;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--tx)}
.hb i{display:block;width:20px;height:2px;border-radius:2px;background:currentColor;transition:transform .2s,opacity .2s}
.hb.open i:nth-child(1){transform:translateY(7px) rotate(45deg)}.hb.open i:nth-child(2){opacity:0}.hb.open i:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.menu{position:absolute;right:10px;top:calc(100% - 4px);min-width:210px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px}
.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;color:var(--tx);border-radius:10px;padding:13px 12px;font-size:15px;font-weight:600}
.menu button.on{background:var(--soft);color:var(--pri)}
.menu button.sep{margin-top:6px;border-top:1px solid var(--line);border-radius:0 0 10px 10px;padding-top:15px}
.scrim{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.18)}
[hidden]{display:none!important}
.pop{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.4);padding:20px}
.pop .box{position:relative;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:16px;max-width:420px;width:100%;max-height:82vh;overflow:auto;padding:16px 16px 14px;box-shadow:0 16px 40px rgba(0,0,0,.28)}
.pop h3{margin:0 28px 8px 0;font-size:15px}
.pop .x{position:absolute;right:8px;top:8px;width:32px;height:32px;padding:0;background:transparent;color:var(--mut);font-size:16px;border-radius:10px}
.er{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.er>span:first-child{color:var(--mut);flex:none}.er b{font-weight:600;text-align:right}
.er.big b{font-size:17px}.er.big{border-top:2px solid var(--line)}.pos{color:var(--ok)}.neg b{color:var(--bad)}
.eh{margin-top:10px;font-weight:700;font-size:13px}.ed{font-size:12.5px;margin:4px 0;padding-left:8px;border-left:3px solid var(--line)}
.ew{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--soft);border-left:4px solid var(--warn);font-size:12.5px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;margin-right:6px;color:#fff;vertical-align:middle;-webkit-print-color-adjust:exact;print-color-adjust:exact}
/* 카드사 대표색: 신한 블루 / 하나 그린 / 삼성 블루(진한 남색) */
.tag.sh{background:#0046ff}.tag.hn{background:#078a5d}.tag.ss{background:#1428a0}
.brow{padding:9px 0;border-top:1px solid var(--line)}.brow:first-of-type{border-top:0}
.bh{font-weight:700;font-size:14px;margin-bottom:3px}
.bl{display:flex;align-items:flex-start;gap:2px;font-size:13px;margin:3px 0}.bl .tag{flex:none;margin-top:1px}
.bul{margin:10px 0 0;padding-left:18px;font-size:13px}.bul li{margin:5px 0}
.bn{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:12px;color:var(--mut)}.bn ul{margin:4px 0 0;padding-left:18px}.bn li{margin:3px 0}
.printhead{display:none}
@media print{
  @page{size:A4;margin:12mm}
  :root{--bg:#fff;--card:#fff;--tx:#000;--mut:#4b5563;--line:#d1d5db;--pri:#1d4ed8;--soft:#eef2ff}
  html,body{background:#fff!important;color:#000}
  .top,.scrim,.no-print,.toast,.pop{display:none!important}
  main{max-width:none;padding:0}
  .card{break-inside:avoid;box-shadow:none;border:1px solid #d1d5db;padding:10px 12px;margin-bottom:8px}
  .card.big{break-inside:auto}
  body{font-size:13px}.brow{padding:6px 0}.bl{margin:2px 0}
  .brow{break-inside:avoid}
  .printhead{display:block;font-size:12px;color:#4b5563;margin-bottom:6px}
  h1{font-size:20px;margin:0 0 4px}
}
.res{border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--card)}
.res.best{border-color:var(--ok)}
.res .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.res .nm{font-weight:700}.res .amt{font-size:22px;font-weight:800}.best .amt{color:var(--ok)}
.res .dt{font-size:13px;color:var(--mut);margin-top:2px}
.badge{font-size:11px;background:var(--ok);color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.hint{background:var(--soft);border-radius:10px;padding:9px 11px;font-size:13px;margin-bottom:10px}
.warn{background:var(--soft);border-left:4px solid var(--warn)}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;background:var(--pri)}
.pool{display:grid;grid-template-columns:1fr 110px;gap:4px 8px;align-items:center;margin-top:10px;font-size:13px}
.pool .full{grid-column:1/-1}
.pool input{padding:6px 8px;text-align:right}
.mut{color:var(--mut);font-size:12px}
.log{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.log:last-child{border:0}
details summary{cursor:pointer;color:var(--pri);font-size:13px;margin-top:10px}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="ttl"><button class="home" onclick="go('rec')" aria-label="카드픽 — 결제카드분석 화면으로 이동">💳 카드픽</button><small id="pg"></small></div>
  <button class="hb" id="mbtn" onclick="toggleMenu()" aria-label="메뉴" aria-haspopup="true" aria-expanded="false"><i></i><i></i><i></i></button>
</div><div class="menu" id="menu" role="menu" hidden></div></header>
<div class="scrim" id="scrim" onclick="closeMenu()" hidden></div>
<main id="app"></main>
<div class="pop" id="pop" onclick="closePop()" hidden></div>
<script>
// ───────────── Firebase 설정 (apiKey가 PLACEHOLDER면 클라우드 동기화 없이 localStorage로만 동작) ─────────────
const FIREBASE_CONFIG = {

  appId: "1:561120311017:web:a3da5d3e497ebfaf1de278"
};
// ───────────── 카드 정의 ─────────────
const CARDS=[{id:'shinhan',name:'신한카드 EV',trLag:1},{id:'hana',name:'MG+ S 하나카드'},{id:'samsung',name:'삼성 iD EV',excl:['transit','taxi','hipass']}];
const CATS=[
 ['mart','🛒 대형마트 (이마트·롯데마트·홈플러스)'],['costco','🏬 코스트코 (현대카드만 결제 가능)'],['cvs','🏪 편의점'],['hosp','💊 병원/약국'],
 ['coffee','☕ 커피전문점 (스벅·커피빈 등)'],['transit','🚇 대중교통 (버스·지하철)'],['taxi','🚕 택시'],
 ['charge','⚡ 전기차 충전'],['hipass','🛣 하이패스'],['parking','🅿 주차장 (케이엠파크)'],['driver','🚗 대리운전 (카카오T)'],
 ['delivery','🛵 배달앱 (배민·쿠팡이츠)'],['stream','🎬 영상 스트리밍 정기결제'],['member','🎟 디지털 멤버십 (네이버플러스·쿠팡와우 등)'],
 ['insurance','🛡 자동차보험 (현대해상 다이렉트)'],['overseas','🌏 해외 결제'],['etc','🧾 기타 일반']];
const CATNAME=Object.fromEntries(CATS);
// 특정 카드만 결제되는 가맹점. 여기에 있는 카테고리는 내 카드(신한·하나·삼성)로 결제할 수 없다
const PAY_ONLY={costco:{shop:'코스트코',only:'현대카드'}};
const payBlocked=cat=>PAY_ONLY[cat]||null;
const T=(p,a)=>{for(const[m,v]of a)if(p>=m)return v;return 0};
const K=3e5;
// 한도 풀: lim(전월실적) → 월(또는 연) 한도
const POOLS={
 shinhan:{charge:{l:'충전 할인 (월)',lim:p=>p>=K?2e4:0},
          hipass:{l:'하이패스 캐시백 (월)',lim:p=>p>=K?5e3:0},
          life:{l:'생활 통합 (편의점·병원·마트·교통·커피)',lim:p=>T(p,[[1e6,3e4],[5e5,2e4],[K,1e4]])},
          ins:{l:'보험료 3만원 (연)',lim:()=>3e4,year:1}},
 hana:{main:{l:'청구할인 통합 (간편결제·스트리밍·멤버십)',lim:p=>T(p,[[1e6,6e4],[6e5,3e4],[K,15e3]])}},
 samsung:{charge:{l:'충전 50/70% (월)',lim:p=>p>=6e5?3e4:p>=K?2e4:0},
          park:{l:'주차·하이패스·대리 통합 (월)',lim:p=>p>=K?5e3:0},
          deliv:{l:'배달앱 (월)',lim:p=>T(p,[[6e5,1e4],[K,5e3]])},
          stream:{l:'스트리밍 (월)',lim:p=>p>=K?5e3:0},
          abroad:{l:'해외 1% (한도 없음)',lim:()=>Infinity},
          ins:{l:'보험료 3만원 (연)',lim:()=>3e4,year:1}}};
// 규칙: c=카테고리('*'=전체) p=풀 rate/fixed cap=건당 인정금액 상한 min=최소결제 wk=주말만
//       sp=true간편결제필수/false간편결제불가 ck=횟수키 dm=일 최대 mm=월 최대
const RULES={
 shinhan:[
  {c:'charge',p:'charge',rate:p=>p>=6e5?.5:.3,sp:false,op:1},
  {c:'hipass',p:'hipass',rate:.1,sp:false},
  {c:'cvs',p:'life',rate:.1,cap:1e4,ck:'cvs',dm:1,mm:5,sp:false},
  {c:'hosp',p:'life',rate:.1,cap:1e4,ck:'hosp',dm:1,mm:5,sp:false},
  {c:'mart',p:'life',rate:.1,cap:5e4,wk:1,ck:'mart',dm:1,sp:false},
  {c:'transit',p:'life',rate:.1,sp:false},
  {c:'taxi',p:'life',rate:.1,sp:false},
  {c:'coffee',p:'life',rate:.1,cap:1e4,ck:'coffee',dm:1,mm:5,sp:false},
  {c:'insurance',p:'ins',fixed:3e4,min:3e5,sp:false}],
 hana:[
  {c:'*',p:'main',rate:.1,min:1e4,sp:true,simple:1},
  {c:'stream',p:'main',rate:.5,sp:false},
  {c:'member',p:'main',rate:.5,sp:false,pt:'m'},
  {c:'member',p:'main',rate:.5,sp:false,pt:'y',ck:'memY',ym:1}],
 samsung:[
  {c:'charge',p:'charge',rate:p=>p>=6e5?.7:.5,sp:false,op:1},
  {c:'parking',p:'park',rate:.1,sp:false},{c:'hipass',p:'park',rate:.1,sp:false},{c:'driver',p:'park',rate:.1,sp:false},
  {c:'delivery',p:'deliv',rate:.1,sp:false},
  {c:'stream',p:'stream',rate:.2,sp:false},
  {c:'overseas',p:'abroad',rate:.01},
  {c:'insurance',p:'ins',fixed:3e4,min:3e5,sp:false}]};
/* ───── 규칙 검증 케이스 (prev = 카드 전월 실적, 결과는 calc() 기준) ─────
 [기존] 토요일(2026-10-03) 이마트 60,000원, 전월 실적 3장 모두 60만원
   실물카드: 신한 5,000(3대마트 주말 10%, 1회 5만원까지 인정) / 하나 0 / 삼성 0
   간편결제: 하나 6,000(10%) / 신한 0 / 삼성 0
 [조건1 신한 교통카드 전전월 기준] 신한 prev=350,000, 전월 교통카드 tr1=100,000, 전전월 tr2=0
   → eff=250,000 (<30만) → 대중교통 10,000원 결제 시 0원 (전월 실적 미달)
   tr2=100,000으로 바꾸면 eff=350,000 → 대중교통 10,000원 = 1,000원 할인
   신한 prev=350,000, tr1=0, tr2=0 → eff=350,000 (교통 이용이 없으면 그대로)
 [조건2 삼성 중복 시 큰 금액 1개만] 삼성 prev=600,000, 해외 가맹점(ov) + 스트리밍 17,000원
   → 스트리밍 20% 3,400 vs 해외 1% 170 → 3,400만 적용 (합산 3,570 아님)
   스트리밍 한도(5,000) 소진 후 같은 결제 → 스트리밍 0, 해외 1% 170 적용
   [삼성 실적 제외] 삼성 prev=700,000(총 사용), 전월 대중교통·택시·하이패스 ex1=150,000
   → eff=550,000 (60만 미만) → 충전 20,000원 결제 시 50% 10,000 (70% 아님)
   ex1=50,000이면 eff=650,000 → 70% 14,000. ex1=0이면 eff=700,000
   월 이월(rollover) 시 ex1 = 이번달 제외 항목(기록+직접입력) 합계, prev = 총 사용
 [충전 사업자] 전월 실적 모두 60만원, 전기차 충전 20,000원
   테슬라 → 신한 0(대상 아님) / 삼성 14,000(70%)
   휴맥스 → 신한 10,000(50%) / 삼성 0
   E-Pit → 신한 10,000이지만 △ 조건부 경고 / 삼성 14,000
   이마트(충전) → 신한·삼성 모두 0 / 사업자 미선택 → 할인은 계산하되 확인 필요 경고
 [조건3 하나 멤버십 연 정기결제 1회] 하나 prev=600,000(한도 30,000), 멤버십 24,000원
   월 정기결제(pt=m) → 12,000 (횟수 제한 없음, 한도 내)
   연 정기결제(pt=y) → 12,000, 기록 후 같은 해 다시 연 결제 → 0 ("올해 이미 사용")
   연 결제 소진 후에도 월 정기결제(pt=m)는 정상 적용 */
// 전기차 충전 사업자별 할인 대상 [이름, 신한EV, 삼성iD EV] (1=대상, 2=△조건부/확인 필요, 0=제외)
// 출처: 충전사업자 별 할인카드 시트(신한 15곳·삼성 14곳). 삼성 안내장에는 '레드이엔지'가 있으나 시트엔 '제주전기자동차서비스'로 표기 → 둘 다 대상 처리.
const CHARGERS=[
 ["환경부 (한국자동차환경협회)", 1, 1],
 ["한국전력공사 (켑코플러그)", 1, 1],
 ["한국전기차충전 (해피차저)", 1, 1],
 ["GS차지비", 1, 1],
 ["파워큐브 (EV-line)", 1, 1],
 ["SK일렉링크 (에스트래픽, SS차저)", 1, 1],
 ["휴맥스", 1, 0],
 ["채비", 1, 1],
 ["홈앤서비스", 1, 0],
 ["소프트베리", 1, 1],
 ["플러그링크", 1, 0],
 ["SK시그넷", 1, 0],
 ["에버온", 1, 1],
 ["테슬라", 0, 1],
 ["E-Pit", 2, 1],
 ["제주전기자동차서비스 (조이이브이/투루차저제주)", 0, 1],
 ["SK에너지", 0, 1],
 ["GS칼텍스", 0, 1],
 ["이지차저", 0, 0],
 ["클린일렉스 (K차저)", 0, 0],
 ["대구공공시설관리공단 (대구환경공단)", 0, 0],
 ["KT", 0, 0],

  const d=blank();if(!o||typeof o!=='object'||Array.isArray(o))return d;
  const out={...o,monthKey:typeof o.monthKey==='string'&&/^\d{4}-\d{2}$/.test(o.monthKey)?o.monthKey:d.monthKey,cards:{}};

    n.newIssue=!!n.newIssue;n.base=x.base&&typeof x.base==='object'&&!Array.isArray(x.base)?x.base:{};out.cards[c.id]=n}

    .map(l=>({...l,amount:Number(l.amount)||0,disc:Number(l.disc)||0}));
  return out}

function evalRule(cid,r,tx,prev){
  const P=POOLS[cid][r.p];
  if(r.wk&&!tx.wk)return{disc:0,why:'주말(토·일)에만 적용'};
  const lim=P.lim(prev);
  if(!(lim>0))return{disc:0,why:`전월 실적 미달 (현재 ${won(prev)}, ${won(K)} 필요)`};
  if(r.min&&tx.amount<r.min)return{disc:0,why:`${won(r.min)} 이상 결제 시 적용`};
  if(r.ck&&r.dm&&cnt(cid,r.ck,'d',tx.date)>=r.dm)return{disc:0,why:'오늘 이미 할인 1회 사용 (일 1회)'};
  if(r.ck&&r.mm&&cnt(cid,r.ck,'m',tx.date)>=r.mm)return{disc:0,why:`월 ${r.mm}회 소진`};
  if(r.ck&&r.ym&&cnt(cid,r.ck,'y',tx.date)>=r.ym)return{disc:0,why:'연 정기결제·단건 할인은 1회만 제공 (올해 이미 사용)'};
  const rem=lim-usedAmt(cid,r.p,tx.date);
  if(rem<=0)return{disc:0,why:'월(연) 할인한도 소진'};
  const rate=typeof r.rate==='function'?r.rate(prev):r.rate;
  const raw=r.fixed!=null?r.fixed:Math.floor(Math.min(tx.amount,r.cap||Infinity)*rate);
  const disc=Math.min(raw,rem);
  const parts=[r.fixed!=null?'정액 '+won(r.fixed):Math.round(rate*100)+'%'+(r.cap?` (건당 ${won(r.cap)}까지 인정)`:'')];
  if(disc<raw)parts.push('한도 부족으로 일부만');
  parts.push(lim===Infinity?'한도 없음':`한도 잔여 ${won(rem)} → ${won(rem-disc)}`);
  return{disc,rule:r,pool:r.p,ck:r.ck,why:parts.join(' · ')};
}
function calc(cid,tx){
  const prev=eff(cid);let best=null,why='해당 혜택 없음';
  for(const r of RULES[cid]){
    if(!(r.c==='*'||r.c===tx.cat||(r.c==='overseas'&&tx.ov)))continue;
    if(r.pt&&r.pt!==(tx.pt||'m'))continue;
    if(r.sp===true&&!tx.sp)continue;
    if(r.sp===false&&tx.sp){why='간편결제로는 혜택 제외 (실물카드/직접결제만)';continue}
    let note='';
    if(r.op&&OPCOL[cid]){const st=opStatus(cid,tx.op);
      if(st===0){why=`이 충전 사업자는 ${CARDS.find(c=>c.id===cid).name} 할인 대상이 아님`;continue}
      note=st===-1?' · ⚠ 충전 사업자 미선택 (대상 업체인지 확인 필요)':st===2?' · ⚠ 조건부(△) 대상 — 사용 전 확인 필요':''}
    const e=evalRule(cid,r,tx,prev);
    if(note&&e.disc>0)e.why+=note;
    if(!best||e.disc>best.disc)best=e;
  }
  return best||{disc:0,why};
}

  const a=calc(cid,{...tx,sp:false}),b=calc(cid,{...tx,sp:true});
  const hasSp=RULES[cid].some(r=>r.sp===true);
  if(b.disc>a.disc||(hasSp&&a.disc===0&&b.disc===0))return{...b,sp:true};
  return{...a,sp:false};
}

function onRemote(snap){
  if(snap.exists&&!snap.metadata.hasPendingWrites){       // Gemini 키: Firestore가 원본, localStorage는 캐시
    const k=snap.data().geminiKey;
    if(typeof k==='string'){if(k!==gkGet()){gkSetLocal(k);gkRefresh()}}
    else if(!snap.metadata.fromCache&&gkGet())gkPush();     // 로그아웃 상태에서 넣은 키가 있고 클라우드엔 없음 → 올림
  }
  if(!snap.exists){if(!snap.metadata.fromCache)pushNow();return}   // 서버 확인 결과 비어 있음 → 로컬 업로드 (캐시만 본 경우엔 대기: 오프라인 신규 기기가 원격을 덮어쓰는 사고 방지)
  if(snap.metadata.hasPendingWrites)return;          // 내가 방금 쓴 변경의 로컬 반영 이벤트 → 무시
  const rs=snap.data().state;
  if(!rs&&!snap.metadata.fromCache){pushNow();return}    // 키만 있고 state가 없는 문서 → 로컬 상태 업로드
  if(!rs||!rs.cards||!Array.isArray(rs.log))return;

  else setSync('동기화됨 '+stamp());                  // 같음
}

const DOW=['일','월','화','수','목','금','토'];
// ───────────── 말로 입력의 날짜 해석 (Gemini에 맡기지 않고 앱이 직접 계산) ─────────────
// 요일만 말하면 '오늘 기준 다가오는 그 요일'(오늘이 그 요일이면 오늘). 지난/저번 = 이미 지난 가장 최근 요일, 다음 = 오늘 이후 첫 요일.
// '이번 주/지난주/다음 주 X요일'은 월~일 기준 주 단위. 어제·그저께·내일·모레, '10월 3일', '10/3' 지원. 해석할 표현이 없으면 null
const addDays=(ds,n)=>{const d=new Date(ds+'T00:00');d.setDate(d.getDate()+n);return d.toLocaleDateString('sv')};
function resolveDateFromText(text,base=today()){
  const t=String(text||''),b=new Date(base+'T00:00'),dow=b.getDay();
  // 1) 명시 날짜: "10월 3일", "10/3"  (소수점 금액 6.5만원 등과 헷갈리지 않도록 '.'는 쓰지 않음)
  const md=t.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/)||t.match(/(?:^|[^\d])(\d{1,2})\/(\d{1,2})(?!\d)/);
  if(md){const mo=+md[1],da=+md[2],d=new Date(b.getFullYear(),mo-1,da);
    if(d.getMonth()===mo-1&&d.getDate()===da)return d.toLocaleDateString('sv')}
  // 2) 요일: (지난주|이번 주|다음주…)? X요일
  const wd=t.match(/(지난\s*주|저번\s*주|전\s*주|이번\s*주|다음\s*주|담\s*주|지난|저번|다음|이번)?\s*([월화수목금토일])\s*(?:요일|욜)/);
  if(wd){const pre=(wd[1]||'').replace(/\s+/g,''),idx=DOW.indexOf(wd[2]);
    if(/주$/.test(pre)){const off=/^(지난|저번|전)/.test(pre)?-1:/^(다음|담)/.test(pre)?1:0;
      return addDays(base,-((dow+6)%7)+7*off+((idx+6)%7))}                 // 월요일 시작 주 기준
    if(/^(지난|저번)/.test(pre)){const diff=((dow-idx+7)%7)||7;return addDays(base,-diff)}   // 이미 지난 가장 최근 요일
    if(/^다음/.test(pre)){const diff=((idx-dow+7)%7)||7;return addDays(base,diff)}           // 오늘 이후 첫 요일
    return addDays(base,(idx-dow+7)%7)}                                                      // 오늘 포함 가장 가까운 다가오는 요일
  // 3) 상대 날짜
  for(const [re,n] of [[/엊그제|그저께|그제/,-2],[/어제/,-1],[/내일모레|모레/,2],[/내일/,1],[/오늘/,0]])if(re.test(t))return addDays(base,n);
  return null;
}
function finishNL(p,text){const d=resolveDateFromText(text);if(d)p.date=d;return p}

let GEMINI_RETRY_MS=700;
async function parseNaturalLanguage(text,onStatus){
  const key=await getGeminiKey();
  if(!key)throw new Error('Gemini API 키가 없습니다. 내 카드 탭 → 데이터에서 키를 등록하세요.');
  text=String(text||'').trim().slice(0,300);
  if(!text)throw new Error('결제 내용을 입력하세요. 예: 어제 이마트 6만원 SSG페이');
  const t0=today(),dw=DOW[new Date(t0+'T00:00').getDay()];
  const prompt=`오늘은 ${t0} (${dw}요일)입니다. 아래 카드 결제 설명을 분석해 JSON 객체 하나만 출력하세요.
필드: {"amount": 결제금액(원, 정수. 모르면 null), "category": 아래 id 중 하나(애매하면 "etc"), "date": "YYYY-MM-DD"(요일만 말하면 오늘 기준 다가오는 그 요일, 지난/저번이 붙으면 지난 요일, 언급 없으면 오늘), "overseas": 해외 결제면 true 아니면 false, "memberType": 멤버십 결제일 때 월 정기면 "m" 연 결제면 "y" (해당 없으면 null), "charger": 전기차 충전 사업자 이름(원문 그대로, 없으면 null)}
category id: ${CATS.map(([k,l])=>k+'='+l.replace(/^\S+\s/,'')).join(' / ')}
결제 설명: <<<${text}>>>`;
  // 모델마다 무료 한도(분당·일일)가 따로라서, 503·429가 나면 같은 모델을 다시 두드리지 않고(한도만 소모) 바로 다음 모델로 넘어간다.
  // 실패한 모델은 잠시 건너뛴다(429: 60초, 5xx: 20초). 전부 건너뛰는 상태면 목록 전체를 다시 시도
  const tStart=Date.now();let order=GEMINI_MODELS.filter(m=>!(modelSkip[m]>tStart));if(!order.length)order=GEMINI_MODELS.slice();
  let lastErr='',busy=false,quota=false,skipLite=false,partial=null;
  outer: for(const m of order){
    if(skipLite&&isLiteModel(m))continue;           // 승격이 정해지면 남은 Lite는 건너뛰고 Flash로
    if(Date.now()-tStart>30000)break;
    if(onStatus&&m!==order[0])onStatus('Gemini가 혼잡해 다른 모델로 시도하는 중…');
    for(let attempt=0;attempt<2;attempt++){         // 네트워크 오류만 같은 모델로 1회 재시도
      const ac=new AbortController(),to=setTimeout(()=>ac.abort(),12000);let res;
      try{res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,{method:'POST',signal:ac.signal,
        headers:{'Content-Type':'application/json','x-goog-api-key':key},
        body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json',temperature:0}})})}
      catch(e){clearTimeout(to);lastErr='네트워크 오류로 분석하지 못했습니다.';if(attempt===0){await new Promise(r=>setTimeout(r,GEMINI_RETRY_MS));continue}break}
      clearTimeout(to);
      if(res.status===404){lastErr='사용 가능한 Gemini 모델을 찾지 못했습니다.';break}
      if(res.status===400||res.status===401||res.status===403)throw new Error('API 키가 올바르지 않거나 권한이 없습니다. 키를 다시 등록해 보세요.');
      if(res.status===429){quota=true;modelSkip[m]=Date.now()+60000;break}
      if(res.status>=500){busy=true;modelSkip[m]=Date.now()+20000;break}
      if(!res.ok){lastErr='Gemini 응답 오류 ('+res.status+')';break}
      let parsed;try{const j=await res.json();parsed=validateNL(j.candidates[0].content.parts[0].text)}
      catch(e){lastErr='Gemini 응답을 해석하지 못했습니다.';if(isLiteModel(m))skipLite=true;break}   // 깨진 응답 → 다음(상위) 모델로
      // 승격: Lite가 금액을 못 뽑았는데 문장엔 금액 표현이 있으면 Flash로 다시 분석
      if(isLiteModel(m)&&parsed.amount===''&&hasAmountHint(text)){partial=partial||parsed;skipLite=true;break}
      return finishNL(parsed,text);
    }
  }
  if(partial)return finishNL(partial,text);                          // Flash까지 실패하면 Lite 결과(금액만 비어 있음)라도 돌려준다
  if(busy)throw new Error('Gemini 서버가 지금 혼잡합니다. 잠시 후 다시 눌러 주세요.');
  if(quota)throw new Error('Gemini 사용 한도를 초과했습니다. 잠시 후 다시 시도하세요.');
  throw new Error(lastErr||'분석하지 못했습니다.');
}
// 모델 출력은 신뢰하지 않고 값을 모두 검증해서 폼에 반영 가능한 형태로 만든다
function validateNL(raw){
  let o;try{o=JSON.parse(String(raw).replace(/^\s*```(?:json)?|```\s*$/g,'').trim())}catch(e){throw new Error('Gemini 응답을 해석하지 못했습니다.')}
  if(!o||typeof o!=='object')throw new Error('Gemini 응답을 해석하지 못했습니다.');
  const amt=Math.round(Number(o.amount));
  const cat=CATNAME[o.category]!==undefined?o.category:'etc';
  let date=today();if(typeof o.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(o.date)&&!isNaN(new Date(o.date+'T00:00')))date=o.date;
  let op='';if(cat==='charge'&&typeof o.charger==='string'){const n=x=>x.toLowerCase().replace(/[\s()·\-]/g,''),q=n(o.charger);
    if(q.length>=2){const i=CHARGERS.findIndex(c=>{const cn=n(c[0]);return cn.includes(q)||q.includes(cn)});if(i>=0)op=String(i)}}
  return{amount:amt>0&&amt<=1e8?amt:'',cat,date,ov:o.overseas===true,pt:o.memberType==='y'?'y':'m',op};
}

// ───────────── 예상 할인 내역 팝업 ─────────────
// 계산 엔진이 돌려준 결과(rule 등)를 사람이 읽을 수 있게 풀어서 보여준다. 계산 자체는 하지 않고 같은 함수·값만 사용
const er=(k,v,cls='')=>`<div class="er ${cls}"><span>${k}</span><b>${v}</b></div>`;
function ruleDesc(cid,r,prev){
  const P=POOLS[cid][r.p],rate=typeof r.rate==='function'?r.rate(prev):r.rate;
  const parts=[r.fixed!=null?`정액 ${won(r.fixed)}`:`${Math.round(rate*100)}%`];
  if(r.cap)parts.push(`1회 ${won(r.cap)}까지 인정`);if(r.min)parts.push(`${won(r.min)} 이상 결제`);
  if(r.wk)parts.push('주말(토·일)만');if(r.sp===true)parts.push('간편결제로 결제 시');if(r.sp===false)parts.push('직접결제(간편결제 제외)');
  if(r.dm)parts.push(`일 ${r.dm}회`);if(r.mm)parts.push(`월 ${r.mm}회`);if(r.ym)parts.push(`연 ${r.ym}회`);
  return`${r.c==='*'?'모든 가맹점':CATNAME[r.c]}: ${parts.join(' · ')} <span class="mut">(${P.l})</span>`;
}
function explainHTML(cid,tx,res){
  const card=CARDS.find(c=>c.id===cid),prev=eff(cid),title=`<h3>${tag(cid)} ${card.name} · 예상 할인 내역</h3>`;
  const head=er('결제 금액',won(tx.amount))+er('결제처',CATNAME[tx.cat])+er('결제 방식',res.sp?'간편결제':'실물카드 · 직접결제');
  const foot=`<div class="mut" style="margin-top:10px">※ 입력하신 실적과 기록을 기준으로 한 예상 금액이며, 실제 할인은 카드사 정산에 따라 다를 수 있어요.</div>`;
  if(res.blocked)return title+head+er('결과','결제 불가','neg')+`<div class="mut" style="margin-top:6px">${res.why}</div>`+foot;
  const r=res.rule;
  if(!(res.disc>0)||!r){   // 할인 없음: 이유 + 이 카드의 해당 혜택 설명
    const rel=RULES[card.id].filter(x=>x.c==='*'||x.c===tx.cat||(x.c==='overseas'&&tx.ov));
    return title+head+er('예상 할인','0원','neg')+er('이유',res.why)+er('적용 중인 전월 실적',won(prev))+
      `<div class="eh">이 카드의 ${CATNAME[tx.cat]} 혜택</div>`+
      (rel.length?rel.map(x=>`<div class="ed">${ruleDesc(card.id,x,prev)}</div>`).join(''):`<div class="ed">이 카드에는 해당 혜택이 없습니다.</div>`)+foot;
  }
  const P=POOLS[card.id][r.p],lim=P.lim(prev),used=usedAmt(card.id,r.p,tx.date),per=P.year?'연':'월';
  const rate=typeof r.rate==='function'?r.rate(prev):r.rate,elig=Math.min(tx.amount,r.cap||Infinity);
  const raw=r.fixed!=null?r.fixed:Math.floor(elig*rate);
  let rows=head+er('적용 혜택',`${r.c==='*'?'간편결제':CATNAME[tx.cat]} · ${P.l}`);
  if(r.fixed!=null)rows+=er('할인',`정액 ${won(r.fixed)}`);
  else{rows+=er('할인율',`${Math.round(rate*100)}%`);
    if(r.cap&&tx.amount>r.cap)rows+=er('할인 인정금액',`${won(elig)} <span class="mut">(1회 상한)</span>`);
    rows+=er('계산',`${won(elig)} × ${Math.round(rate*100)}% = ${won(raw)}`)}
  if(lim===Infinity)rows+=er('한도','없음');
  else{rows+=er(`${per} 한도`,`${won(lim)} <span class="mut">(실적 ${won(prev)} 기준)</span>`)+er(`이번 ${per==='연'?'해':'달'} 사용`,won(used))+er('남은 한도',won(lim-used));
    if(res.disc<raw)rows+=er('한도 부족',`${won(raw)} 중 ${won(res.disc)}만 적용`,'neg')}
  if(r.ck){
    if(r.dm)rows+=er('오늘 사용 횟수',`${cnt(card.id,r.ck,'d',tx.date)} / ${r.dm}회`);
    if(r.mm)rows+=er('이번 달 사용 횟수',`${cnt(card.id,r.ck,'m',tx.date)} / ${r.mm}회`);
    if(r.ym)rows+=er('올해 사용 횟수',`${cnt(card.id,r.ck,'y',tx.date)} / ${r.ym}회`)}
  rows+=er('예상 할인',`<span class="pos">-${won(res.disc)}</span>`,'big');
  if(lim!==Infinity)rows+=er('사용 후 남은 한도',won(lim-used-res.disc));
  const warn=[];if(res.sp)warn.push('간편결제(네이버페이·카카오페이·토스페이·SSG페이·11pay·스마일페이)로 결제해야 적용됩니다');
  const w=(res.why.match(/⚠[^·]*/)||[])[0];if(w)warn.push(w.replace('⚠','').trim());
  if(card.excl&&card.excl.includes(tx.cat))warn.push('이 결제는 삼성 전월 실적에서 제외됩니다');
  return title+rows+(warn.length?`<div class="ew">${warn.map(t=>'⚠ '+t).join('<br>')}</div>`:'')+foot;
}

function record(cid){
  const tx=mkTx(false),e=calcBest(cid,tx);
  if(e.blocked)return toast(e.why);
  S.log.unshift({id:`${Date.now()}_${Math.random().toString(36).slice(2,8)}`,date:tx.date,card:cid,cat:tx.cat,amount:tx.amount,disc:e.disc,pool:e.pool||null,ck:e.disc>0?e.ck||null:null});
  save();form.amount='';tab='rec';render();
  toast(`${CARDS.find(c=>c.id===cid).name} 기록됨 (할인 ${won(e.disc)})`);
}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;
  d.style.cssText='position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#111;color:#fff;padding:9px 14px;border-radius:20px;font-size:13px;z-index:9';
  document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}

function vCards(){
  return`<h1>내 카드 · 실적 입력</h1>`+CARDS.map(c=>{
    const cs=S.cards[c.id],prev=eff(c.id),ms=monthSpend(c.id)-exThis(c.id),nx=(TH[c.id].find(t=>t>ms));
    const pools=Object.entries(POOLS[c.id]).map(([pid,P])=>{
      const lim=P.lim(prev),used=usedAmt(c.id,pid,today()),pct=lim===Infinity||!lim?0:Math.min(100,used/lim*100);
      return`<div>${P.l}<div class="mut">${lim===Infinity?'한도 없음':lim>0?`한도 ${won(lim)}`:'실적 미달 (혜택 없음)'}</div></div>
      <input type="number" inputmode="numeric" value="${Math.round(used)}" onchange="setUsed('${c.id}','${pid}',this.value)">
      ${lim>0&&lim!==Infinity?`<div class="full bar"><i style="width:${pct}%"></i></div>`:''}`}).join('');
    const cks=[...new Set(RULES[c.id].filter(r=>r.mm).map(r=>r.ck))].map(ck=>
      `<div>${CKNAME[ck]} 할인 횟수 (이번달)</div><input type="number" value="${cnt(c.id,ck,'m',today())}" onchange="setCnt('${c.id}','${ck}',this.value)">`).join('');
    return`<div class="card"><h2>${c.name}</h2>
      <label>전월 실적 (원) — 지난달 실적 인정 사용액</label>
      <input type="number" inputmode="numeric" value="${cs.prev||''}" placeholder="0" onchange="S.cards['${c.id}'].prev=+this.value||0;save();render()">
      ${c.trLag?`<label>전월 교통카드 이용액 — 실적에서 제외됨</label><input type="number" inputmode="numeric" value="${cs.tr1||''}" placeholder="0" onchange="S.cards['${c.id}'].tr1=+this.value||0;save();render()">
      <label>전전월 교통카드 이용액 — 실적에 대신 포함됨</label><input type="number" inputmode="numeric" value="${cs.tr2||''}" placeholder="0" onchange="S.cards['${c.id}'].tr2=+this.value||0;save();render()">
      <label>이번달 교통카드 이용액 (앱 기록 외, 다음달 보정용)</label><input type="number" inputmode="numeric" value="${cs.trNow||''}" placeholder="0" onchange="S.cards['${c.id}'].trNow=+this.value||0;save();render()">`:''}
      ${c.excl?`<label>전월 대중교통·택시·하이패스 이용액 — 실적에서 자동 제외</label><input type="number" inputmode="numeric" value="${cs.ex1||''}" placeholder="0" onchange="S.cards['${c.id}'].ex1=+this.value||0;save();render()">
      <label>이번달 대중교통·택시·하이패스 이용액 (앱 기록 외, 다음달 제외용)</label><input type="number" inputmode="numeric" value="${cs.exNow||''}" placeholder="0" onchange="S.cards['${c.id}'].exNow=+this.value||0;save();render()">`:''}
      <label class="chk"><input type="checkbox" ${cs.newIssue?'checked':''} onchange="S.cards['${c.id}'].newIssue=this.checked;save();render()">신규 발급 (등록월+1개월까지 30만원 구간 혜택 보장)</label>
      <div class="mut" style="margin-top:8px">적용 중인 실적: <b>${won(prev)}</b> · 이번달 누적 사용: <b>${won(ms)}</b>${nx?` · 다음달 다음 구간까지 ${won(nx-ms)}`:' · 최상위 구간 달성'}</div>
      <details><summary>이번달 사용한 할인 (앱 밖에서 받은 할인은 여기서 수정)</summary>
        <div class="pool">${pools}${cks}
          <div>이번달 직접입력 실적 (앱 기록 외)</div><input type="number" value="${cs.spend||0}" onchange="S.cards['${c.id}'].spend=+this.value||0;save();render()">
        </div></details></div>`}).join('');
}
// 데이터 · 계정 화면 (삼선 메뉴 맨 아래)
function vData(){
  return`<h1>데이터 · 계정</h1>
  <div class="card"><h2>계정 · 동기화</h2>${cloudUI()}</div>
  <div class="card"><h2>말로 입력 (Gemini)</h2>
     <label>Gemini API 키</label>
     <div id="gkst" class="mut">${gkGet()?'저장됨  ••••••••':'미등록'}</div>
     <div class="row" style="margin-top:4px"><input id="gk" type="password" autocomplete="off" placeholder="${gkGet()?'••••••••':'API 키 붙여넣기'}"><button onclick="gkSaveUI()" style="flex:none">저장</button><button class="ghost" onclick="gkDelete()" style="flex:none">삭제</button></div>
     <div class="mut" style="margin-top:6px">로그인 상태면 내 계정에만 저장되어 다른 기기에서도 쓰입니다. 백업(JSON)에는 포함되지 않습니다.</div></div>
  <div class="card"><h2>백업 · 초기화</h2>
     <div class="row"><button class="ghost" onclick="exp()">백업(JSON 복사)</button><button class="ghost" onclick="imp()">복원</button></div>
     <details><summary>초기화 · 삭제</summary>
       <div class="mut" style="margin:8px 0">로그인 상태면 다른 기기에도 똑같이 반영됩니다. 되돌릴 수 없으니 필요하면 먼저 백업하세요.</div>
       <div class="row" style="flex-wrap:wrap">
         <button class="ghost" onclick="resetMonth()">이번달 기록·사용량 초기화</button>
         <button class="ghost" onclick="clearLog()">결제 기록 전체 삭제</button>
         <button class="ghost" style="color:var(--bad)" onclick="resetAll()">모든 데이터 초기화</button></div></details>
     ${cloudReady()?'':'<div class="mut" style="margin-top:8px">데이터는 이 기기(브라우저)에 저장됩니다. 다른 기기로 옮길 때 백업 → 복원을 사용하세요.</div>'}</div>`;
}
// 초기화: 실적(전월 실적·신규발급 등 카드 설정)은 유지하고 이번달 결제 기록과 사용량만 비운다
function resetMonth(){
  if(!confirm(`${S.monthKey} 결제 기록과 이번달 사용량(할인 사용액·횟수·직접입력 실적)을 초기화할까요?\n전월 실적 설정은 유지됩니다.`))return;
  S.log=S.log.filter(l=>!l.date.startsWith(S.monthKey));
  for(const c of CARDS){const cs=S.cards[c.id];cs.spend=0;cs.trNow=0;cs.exNow=0;cs.base={}}
  save();render();toast('이번달 기록·사용량을 초기화했습니다');
}
function clearLog(){
  if(!confirm(`결제 기록 ${S.log.length}건을 전부 삭제할까요?\n(이번달 할인 사용량도 함께 0이 됩니다)`))return;
  S.log=[];save();render();toast('결제 기록을 삭제했습니다');
}
function resetAll(){
  if(!confirm('전월 실적, 결제 기록 등 모든 데이터를 지우고 처음 상태로 되돌릴까요?\n로그인 상태면 클라우드 데이터도 함께 초기화됩니다.'))return;
  S=blank();save();render();toast('모든 데이터를 초기화했습니다');
}
function setUsed(cid,pid,v){const P=POOLS[cid][pid],k=per(P,today());
  const lg=logSum(cid,l=>l.pool===pid&&per(P,l.date)===k);
  S.cards[cid].base['$'+pid]=Math.max(0,(+v||0)-lg);save();render()}
function setCnt(cid,ck,v){const n=S.log.filter(l=>l.card===cid&&l.ck===ck&&l.date.slice(0,7)===curMonth()).length;
  S.cards[cid].base['#'+ck]=Math.max(0,(+v||0)-n);save();render()}
function exp(){const t=JSON.stringify(S);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('클립보드에 복사됨')).catch(()=>prompt('아래 내용을 복사하세요',t))}
function imp(){const t=prompt('백업 JSON을 붙여넣으세요');if(!t)return;try{const o=JSON.parse(t);if(!o.cards||!o.log)throw 0;S=sanitize(o);save();render();toast('복원 완료')}catch(e){alert('형식이 올바르지 않습니다')}}

function vLog(){
  const m=S.log.filter(l=>l.date.startsWith(curMonth())),sum=m.reduce((a,l)=>a+l.disc,0);
  return`<h1>결제 기록</h1><div class="hint">이번달 할인 합계 <b>${won(sum)}</b> · ${m.length}건</div><div class="card">`+
   (S.log.length?S.log.slice(0,100).map(l=>`<div class="log"><div><b>${CARDS.find(c=>c.id===l.card).name}</b> · ${CATNAME[l.cat]}<div class="mut">${l.date} · ${won(l.amount)}</div></div>
   <div style="text-align:right;white-space:nowrap"><span style="color:var(--ok);font-weight:700">-${won(l.disc)}</span><br><button class="sm ghost" onclick="delLog('${l.id}')">삭제</button></div></div>`).join(''):'<div class="mut">아직 기록이 없어요</div>')+`</div>`;
}
function delLog(id){S.log=S.log.filter(l=>String(l.id)!==String(id));save();render()}
render();
initCloud();
if('serviceWorker' in navigator){
  // 새 버전 서비스워커가 인계받으면 자동으로 새로고침 (입력 중이면 다음 실행 때 반영). 첫 설치 때는 새로고침하지 않음
  const hadCtl=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!hadCtl||reloaded)return;
    const a=document.activeElement;if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))return;
    reloaded=true;location.reload()});
  window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').then(r=>r.update()).catch(()=>{}));
}
</script>
</body>
