*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top .in{max-width:560px;margin:0 auto;height:52px;padding:0 16px;display:flex;align-items:center;gap:12px}
.back{color:var(--pri);font-weight:700;text-decoration:none;font-size:14px;white-space:nowrap}
.ttl{font-size:17px;font-weight:800;letter-spacing:-.3px;margin:0;line-height:1.3}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:19px;margin:4px 0 12px}h2{font-size:15px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 3px}
input,select,button{font:inherit;color:inherit}
input[type=text],select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
button,.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--pri);color:#fff;cursor:pointer;font-weight:600;text-decoration:none;display:inline-block}
button.ghost,.btn.ghost{background:transparent;color:var(--pri);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>.grow{flex:1;min-width:0}
.mut{color:var(--mut);font-size:12px}
.hint{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.hint.warn{border-left:4px solid var(--warn)}.hint.bad{border-left:4px solid var(--bad)}
.store{padding:12px 0;border-top:1px solid var(--line)}.store:first-child{border-top:0}
.store b{font-size:15px}.store .sub{font-size:13px;color:var(--mut)}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;margin:4px 6px 0 0;background:var(--soft);color:var(--pri)}
.chip.off{background:transparent;color:var(--mut);border:1px solid var(--line);font-weight:500}
.cnt{font-size:13px;margin:0 2px 8px}
.seg{display:flex;gap:4px;padding:4px;background:var(--soft);border-radius:12px;margin:0 0 12px}
.seg button{flex:1;background:transparent;color:var(--mut);padding:9px 6px;border-radius:9px;font-size:14px}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.sub0{font-size:12.5px;color:var(--mut);margin:-2px 0 8px}
.store.tap{cursor:pointer}.store.tap:active,.store.tap:focus-visible{background:var(--soft);outline:none;border-radius:8px}   /* 구분선 끝이 둥글게 말리지 않도록 평소엔 모서리 없음 */
.store .more{float:right;color:var(--pri);font-size:12px;font-weight:600}
.pop{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.4);padding:20px}
.pop .box{position:relative;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:16px;max-width:440px;width:100%;max-height:88vh;overflow:auto;padding:16px 16px 0;box-shadow:0 16px 40px rgba(0,0,0,.28)}
.pop h3{margin:0 30px 6px 0;font-size:17px}
.pop .x{position:absolute;right:8px;top:8px;width:34px;height:34px;padding:0;background:transparent;color:var(--mut);font-size:16px;border-radius:10px}
.er{display:flex;justify-content:space-between;gap:14px;padding:5px 0;border-top:1px solid var(--line);font-size:13.5px}.er>span:first-child{color:var(--mut);flex:none}.er b{font-weight:600;text-align:right}
.sec{margin-top:10px;padding:8px 11px;border-radius:10px;background:var(--soft);font-size:13px}.sec b.t{display:block;margin-bottom:2px}
.sec.warn{border-left:4px solid var(--warn)}
.pop .stick{position:sticky;bottom:0;background:var(--card);padding:10px 0 14px;margin-top:6px}
.pop .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.pop .acts .btn{padding:7px 11px;font-size:13px}

// ───────────── 도우미 ─────────────
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won=n=>Number(n).toLocaleString('ko-KR');
// 현재 위치 → 시·도 추정: 주요 시군 좌표 중 가장 가까운 지점의 시·도. 멀리(150km↑) 떨어져 있으면 null (해외 등). 서버·외부 서비스를 쓰지 않음
function guessSido(lat,lon){
  if(typeof lat!=='number'||typeof lon!=='number'||!isFinite(lat)||!isFinite(lon))return null;
  let best=null,bd=Infinity;
  for(const [sido,list] of Object.entries(SIDO_PTS))for(const [a,b] of list){
    const dy=(lat-a)*111.2,dx=(lon-b)*111.2*Math.cos(lat*Math.PI/180),d=Math.hypot(dx,dy);   // km
    if(d<bd){bd=d;best=sido}}
  return bd<=150?best:null;
}
// 검색 주소 만들기. 키는 주소에 넣지 않고 Authorization 헤더로 보냄
function buildUrl(path,{name,sido,market,page}){
  const p=new URLSearchParams({page:String(page||1),perPage:String(PER_PAGE),returnType:'JSON'});
  if(name)p.set('cond[가맹점명::LIKE]',name);
  if(sido)p.set('cond[소재지::EQ]',sido);
  if(market)p.set('cond[소속 시장명(또는 상점가)::LIKE]',market);
  return ODCLOUD+path+'?'+p.toString();
}
// swagger에서 가장 최근 날짜(…_YYYYMMDD) 버전의 경로 선택
function latestPath(doc){
  let best=null;
  for(const [path,v] of Object.entries((doc&&doc.paths)||{})){
    const m=/_(\d{8})$/.exec((v&&v.get&&v.get.summary)||'');if(!m)continue;
    if(!best||m[1]>best.date)best={date:m[1],path};
  }
  return best;
}
function normRow(r){
  r=r||{};
  return{name:r['가맹점명'],market:r['소속 시장명(또는 상점가)'],sido:r['소재지'],item:r['취급품목'],paper:r['지류형 가맹 여부']==='Y',digital:r['디지털형 가맹 여부']==='Y',year:r['가맹 등록년도']};
}

}

// ───────────── 가게 상세 팝업 ─────────────
// 같은 이름 가게를 구별할 수 있도록 '가게명 + 시장·상점가(없으면 시·도)'로 지도 검색 링크를 만든다 (주소가 없는 데이터의 한계 보완)
const sidoLabel=v=>(SIDO.find(x=>x[0]===v)||[0,v||''])[1];
function mapQuery(r){return((r.name||'')+' '+(r.market||sidoLabel(r.sido).replace('·',' '))).trim()}
const MAP_LINKS=[['카카오맵',q=>'https://map.kakao.com/?q='+encodeURIComponent(q)],['네이버지도',q=>'https://map.naver.com/p/search/'+encodeURIComponent(q)]];
const er=(k,v)=>`<div class="er"><span>${k}</span><b>${v}</b></div>`;
function storePopup(r){

      앱에 <b>본인 카드를 등록해 충전</b>한 뒤, 등록한 카드나 QR로 결제하는 방식이에요. 가게마다 되는 카드가 다른 게 아니라, <b>앱에 등록할 수 있는 카드사가 정해져</b> 있어요 (신한·현대·삼성·농협·하나·BC·KB국민·롯데로 알려져 있어요).
      <div class="mut" style="margin-top:4px">※ 이 안내는 공공데이터가 아니라 일반 정보예요. 카드사 목록은 바뀔 수 있으니 <b>디지털온누리 앱이나 공식 사이트에서 확인</b>하세요.</div></div>
    <div class="sec warn"><b class="t">⚠ 카드 실적·혜택 참고</b>상품권 충전은 카드 <b>전월 실적이나 할인 혜택에서 제외될 수 있어요</b> (카드마다 달라요). 이용하는 카드사에 확인하세요.</div>`

    ${er('소속 시장·상점가',esc(r.market||'정보 없음'))}${er('시·도',esc(sidoLabel(r.sido)||'정보 없음'))}${er('취급품목',esc(r.item||'정보 없음'))}
    ${er('지류형 가맹',r.paper?'가능':'정보 없음')}${er('디지털형 가맹',r.digital?'가능':'정보 없음')}${r.year?er('가맹 등록',esc(r.year)+'년'):''}
    <div class="mut" style="margin-top:10px">같은 이름의 다른 가게와 헷갈리지 않게 지도에서 위치를 확인해 보세요.</div>
    <div class="acts">${MAP_LINKS.map(([n,f])=>`<a class="btn ghost" href="${esc(f(q))}" target="_blank" rel="noopener noreferrer">${n}에서 찾기 ↗</a>`).join('')}<a class="btn ghost" href="https://www.onnuri.gift/" target="_blank" rel="noopener noreferrer">온누리 공식 사이트 ↗</a></div>

}
function openStore(i){if(!(i>=0&&S.rows[i]))return;S.sel=i;render()}
function closeStore(){if(S.sel<0)return;S.sel=-1;render()}

// 키 문서의 어디가 문제인지 알려주는 진단. 필드 '이름'과 값의 '길이·종류'만 사용하고 값 자체는 어디에도 쓰지 않음
function diagKey(d,field,re){
  d=d&&typeof d==='object'?d:{};
  if(!(field in d)){
    const near=Object.keys(d).find(k=>k.trim().toLowerCase()===field.toLowerCase());
    return near?`필드 이름이 "${near}"로 되어 있어요. 정확히 "${field}"(대소문자·공백 포함)여야 해요.`:`"${field}" 필드가 없어요. (현재 필드: ${Object.keys(d).join(', ')||'없음'})`;
  }
  const v=d[field];
  if(typeof v!=='string')return`"${field}" 값이 문자열이 아니에요 (현재 타입: ${v===null?'null':typeof v}). 문자열(string)로 만들어 주세요.`;
  const t=v.trim(),why=[];
  if(!t)why.push('비어 있어요');
  else{
    if(/^https?:/i.test(t))why.push('키가 아니라 주소(URL)가 들어 있어요');
    if(/["'`]/.test(t))why.push('따옴표가 들어 있어요');
    if(/\s/.test(t))why.push('가운데에 공백·줄바꿈이 있어요');
    if(/[^\x21-\x7e]/.test(t.replace(/\s/g,'')))why.push('한글 등 영숫자가 아닌 문자가 있어요');
    if(/[^A-Za-z0-9+/=%_-]/.test(t.replace(/["'`\s]/g,''))&&!why.length)why.push('허용되지 않는 기호가 있어요');
    if(!why.length&&!re.test(t))why.push('길이가 맞지 않아요');
  }
  return`값 길이 ${t.length}자 · 문제: ${why.join(', ')||'형식이 맞지 않아요'}. 키만 정확히 붙여 넣어 주세요.`;
}

    if(!res.ok)throw new Error('조회 중 오류가 났어요 (코드 '+res.status+'). 잠시 후 다시 시도해 주세요.');
    const d=await res.json();
    if(d&&typeof d.code==='number'&&d.code<0)throw new Error('조회 중 오류가 났어요 (코드 '+d.code+').');
    const rows=Array.isArray(d.data)?d.data.map(normRow):[];
    S.rows=append?S.rows.concat(rows):rows;S.page=page;S.total=Number(d.matchCount)||0;
  }catch(e){

    if(!append){S.rows=[];S.total=0;S.page=0}

const SIGUN=Object.keys(SIGUN_PTS).map(n=>[n]);   // 시·군 목록(데이터의 SIGUN_NM 값). 넓은 시는 권역별 기준점을 여러 개 둠

function guessSigun(lat,lon){
  if(typeof lat!=='number'||typeof lon!=='number'||!isFinite(lat)||!isFinite(lon))return null;
  let best=null,bd=Infinity;
  for(const [n,list] of Object.entries(SIGUN_PTS))for(const [a,b] of list){const d=distKm({lat,lon},{lat:a,lon:b});if(d<bd){bd=d;best=n}}
  return bd<=40?best:null;
}
function distKm(a,b){   // 하버사인
  const R=6371,r=x=>x*Math.PI/180,dLa=r(b.lat-a.lat),dLo=r(b.lon-a.lon);
  const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const fmtKm=k=>k<1?Math.max(10,Math.round(k*100)*10)+'m':(k<10?k.toFixed(1):Math.round(k))+'km';

const ggClean=s=>String(s||'').replace(/[%_*'"`\;<>]/g,'').replace(/\s+/g,' ').trim();
function ggBuildUrl(key,{sigun,name,page,size}){
  const p=new URLSearchParams({KEY:key,Type:'json',pIndex:String(page||1),pSize:String(Math.min(1000,Math.max(1,size||GG_PAGE)))});
  if(sigun)p.set('SIGUN_NM',sigun);
  if(name)p.set('CMPNM_NM',name);
  return GG_URL+'?'+p.toString();
}
// 정상 응답과 오류/없음 응답(최상위 RESULT) 두 형태를 모두 처리
function ggParse(j){
  if(j&&j.RegionMnyFacltStus){
    const a=j.RegionMnyFacltStus,head=(a[0]&&a[0].head)||[],res=(head.find(x=>x&&x.RESULT)||{}).RESULT||{};
    const tot=(head.find(x=>x&&x.list_total_count!=null)||{}).list_total_count;
    return{code:res.CODE||'',total:Number(tot)||0,rows:Array.isArray(a[1]&&a[1].row)?a[1].row:[]};
  }
  if(j&&j.RESULT)return{code:j.RESULT.CODE||'',total:0,rows:[]};
  return{code:'BAD',total:0,rows:[]};
}
function ggTypeLabel(s){
  s=String(s||'').trim();let m=/^\d+\((.*)\)$/.exec(s)||/^\((.*)\)$/.exec(s);if(m)s=m[1];
  s=s.split('/').map(x=>x.trim()).filter((x,i,a)=>a.indexOf(x)===i).join('/');             // "편의점/편의점" → "편의점"
  const h=s.length/2;if(Number.isInteger(h)&&h>0&&s.slice(0,h)===s.slice(h))s=s.slice(0,h);   // "일반음식점일반음식점" → "일반음식점"
  return s;
}
// 사업자등록번호 등 화면에 필요 없는 항목은 버림

    lat:isFinite(lat)&&lat>30&&lat<40?lat:null,lon:isFinite(lon)&&lon>120&&lon<135?lon:null,

}

    <button class="x" id="pop_close" aria-label="닫기" onclick="ggCloseStore()">✕</button>
    <h3>${esc(r.name||'(이름 없음)')}</h3>
    ${er('업종',esc(r.type||'정보 없음'))}${er('시·군',esc(r.sigun||'정보 없음'))}${er('도로명주소',esc(r.road||'정보 없음'))}${r.lot?er('지번주소',esc(r.lot)):''}${r.zip?er('우편번호',esc(r.zip)):''}
    ${er('영업 상태',esc(ggStatusLabel(r)))}${near!=null?er('내 위치에서',esc(fmtKm(near))):''}
    <div class="acts"><a class="btn ghost" href="${esc(kakao)}" target="_blank" rel="noopener noreferrer">카카오맵에서 보기 ↗</a><a class="btn ghost" href="${esc(naver)}" target="_blank" rel="noopener noreferrer">네이버지도에서 찾기 ↗</a><a class="btn ghost" href="https://search.konacard.co.kr/payable-merchants" target="_blank" rel="noopener noreferrer">공식 매장 검색 ↗</a></div>
    ${r.stCode==='03'||r.stCode==='02'?`<div class="sec warn"><b class="t">⚠ ${r.stCode==='03'?'폐업':'휴업'}한 곳이에요</b>지금은 이용할 수 없을 수 있어요. 가게에 먼저 확인하세요.</div>`:''}
    <div class="sec"><b class="t">ℹ 가맹점 정보에 대해</b>이 정보는 카드사에 등록된 내용이라 <b>업종·상호 변경, 직영점 전환 등으로 실제와 다를 수 있어요.</b> 결제 가능 여부와 쓸 수 있는 상품권 종류는 가게나 경기지역화폐 앱에서 확인하세요.</div>
    <div class="stick"><button class="ghost" style="width:100%" onclick="ggCloseStore()">닫기</button></div></div></div>`;
}
function ggBox(){
  const m={loading:['','경기도 조회 키를 불러오는 중…'],missing:['warn','경기도 조회 키가 아직 등록되지 않았어요. 관리자가 Firebase에 <b>config / gg</b> 문서(필드 <b>ggKey</b>)를 만들어야 해요.'],invalid:['bad','등록된 경기도 조회 키의 형식이 올바르지 않아요. 관리자에게 알려 주세요.'+(G.diag?`<div class="mut" style="margin-top:4px">🔎 ${esc(G.diag)}</div>`:'')],denied:['bad','이 계정은 경기도 조회 키를 읽을 권한이 없어요.'],error:['bad','경기도 조회 키를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.']}[G.st];
  const ok=G.st==='ok';
  let h=`<div class="card"><h2>경기지역화폐</h2><div class="sub0">경기도 31개 시·군 · 경기도 공공데이터(카드사 등록 기준)</div>`;
  if(S.auth!=='in')h+=`<div class="mut" style="margin-bottom:8px">로그인하면 앱 안에서 조회할 수 있어요.</div>`;
  else if(m)h+=`<div class="hint ${m[0]}">${m[1]}</div>`;
  if(S.auth==='in'&&ok){
    h+=`<form onsubmit="return ggOnSearch(event)"><label>가게명 (일부만 입력해도 돼요)</label><input id="g_name" type="text" maxlength="30" autocomplete="off" placeholder="예: 약국, 정육점" value="${esc(G.q.name)}" oninput="ggSet('name',this.value)">
      <label>시·군</label><div class="row"><select id="g_sigun" class="grow" onchange="ggSet('sigun',this.value)"><option value="">경기도 전체</option>${SIGUN.map(([n])=>`<option value="${esc(n)}" ${G.q.sigun===n?'selected':''}>${esc(n)}</option>`).join('')}</select><button type="button" class="ghost" onclick="locate()">📍 현재 위치</button></div>
      <label class="chk"><input type="checkbox" ${G.openOnly?'checked':''} onchange="ggToggle('openOnly',this.checked)"> 영업 중인 곳만 보기 (폐업·휴업 숨김)</label>
      ${G.pos?`<label class="chk"><input type="checkbox" ${G.nearFirst?'checked':''} onchange="ggToggle('nearFirst',this.checked)"> 가까운 순으로 보기</label>`:''}
      <div style="margin-top:12px"><button type="submit" style="width:100%" ${G.busy?'disabled':''}>${G.busy?'조회 중…':'경기지역화폐 조회'}</button></div></form>`;
    h+=locBox();
    if(G.err)h+=`<div class="hint bad" style="margin-top:10px">${esc(G.err)}</div>`;
    if(G.msg)h+=`<div class="hint" style="margin-top:10px">${esc(G.msg)}</div>`;
    if(G.searched&&!G.err){
      const v=ggView();
      if(!G.all.length)h+=`<div style="margin-top:10px"><b>조회된 가맹점이 없어요</b><div class="mut">상호의 일부만 넣거나 시·군을 바꿔 다시 찾아 보세요.</div></div>`;
      else{
        const hidden=G.all.length-v.length;
        h+=`<div class="cnt" style="margin-top:10px">총 <b>${won(G.total)}곳</b>${G.all.length<G.total?` 중 ${won(G.all.length)}곳을 불러옴`:''} · 지금 목록 <b>${won(v.length)}곳</b>${hidden>0?` <span class="mut">(폐업·휴업 ${won(hidden)}곳 숨김)</span>`:''}</div>`;
        if(!v.length)h+=`<div class="mut">불러온 결과가 모두 폐업·휴업이에요. "영업 중인 곳만 보기"를 끄거나 더 불러와 보세요.</div>`;
        h+=v.slice(0,G.shown).map(({r,i,d})=>`<div class="store tap" role="button" tabindex="0" onclick="ggOpenStore(${i})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();ggOpenStore(${i})}"><span class="more">상세 ›</span><b>${esc(r.name||'(이름 없음)')}</b>
          <div class="sub">${esc(r.type||'업종 정보 없음')} · ${esc(r.sigun||'')}</div><div class="sub">${esc(r.road||r.lot||'주소 정보 없음')}</div>
          <span class="chip ${ggOpen(r)?'':'off'}">${esc(ggStatusLabel(r))}</span>${d!=null?`<span class="chip off">${esc(fmtKm(d))}</span>`:''}</div>`).join('');
        if(v.length>G.shown||G.all.length<G.total)h+=`<button class="ghost" style="width:100%;margin-top:8px" onclick="ggMore()" ${G.busy?'disabled':''}>더 보기</button>`;
        if(G.pos&&G.nearFirst&&G.all.length<G.total)h+=`<div class="mut" style="margin-top:6px">※ 가까운 순은 지금까지 불러온 ${won(G.all.length)}곳 안에서의 순서예요. 더 보기를 누르면 더 불러와요.</div>`;
      }
    }
  }
  h+=`<div class="mut" style="margin-top:10px">${ok?'정보는 경기도 공공데이터(카드사 등록 기준)예요. 폐업·변경은 늦게 반영될 수 있어요. ':''}공식 화면에서도 확인할 수 있어요.</div>
    <div class="row" style="margin-top:8px"><a class="btn ghost" href="https://search.konacard.co.kr/payable-merchants" target="_blank" rel="noopener noreferrer">경기지역화폐 공식 매장 검색 ↗</a></div></div>`;
  return h;
}

// ───────────── 화면 ─────────────
function authBox(){
  switch(S.auth){
    case'init':return`<div class="hint">로그인 상태를 확인하는 중…</div>`;
    case'nofirebase':return`<div class="hint bad"><b>로그인 기능을 불러오지 못했어요.</b><br>인터넷 연결을 확인하고 다시 열어 주세요.</div>`;
    case'out':return`<div class="card"><h2>로그인이 필요해요</h2><div class="mut" style="margin-bottom:10px">온누리 조회에 쓰는 공용 키는 로그인한 사용자에게만 제공돼요. 카드픽에서 쓰는 Google 계정으로 로그인해 주세요.</div><button onclick="login()">Google로 로그인</button>${S.err?`<div class="mut" style="color:var(--bad);margin-top:8px">${esc(S.err)}</div>`:''}</div>`;
  }
  return'';
}
// 온누리 키 상태 안내 (온누리 영역 안에 표시)
function keyHint(){
  if(S.auth!=='in')return`<div class="mut" style="margin-bottom:8px">로그인하면 조회할 수 있어요.</div>`;
  const m={loading:['','키를 불러오는 중…'],
    missing:['warn','조회 키가 아직 등록되지 않았어요. 관리자가 Firebase에 <b>config / odcloud</b> 문서를 만들어야 해요.'],
    invalid:['bad','등록된 조회 키의 형식이 올바르지 않아요. 관리자에게 알려 주세요.'+(S.diag?`<div class="mut" style="margin-top:4px">🔎 ${esc(S.diag)}</div>`:'')],
    denied:['bad','이 계정은 조회 키를 읽을 권한이 없어요. (관리자가 접근을 허용해야 해요)'],
    error:['bad','조회 키를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.']}[S.keyStatus];
  return m?`<div class="hint ${m[0]}">${m[1]}</div>`:'';
}
function resultsBox(){
  const q=S.q;let h='';
  if(S.err)h+=`<div class="hint bad">${esc(S.err)}</div>`;
  if(S.msg)h+=`<div class="hint">${esc(S.msg)}</div>`;
  if(S.page>0&&!S.err){
    if(!S.rows.length){
      h+=`<div style="margin-top:10px"><b>조회된 가맹점이 없어요</b><div class="mut" style="margin-top:4px">온누리상품권 가맹점이 아니거나, 등록된 이름이 달라서일 수 있어요. 간판과 다르게 등록된 경우도 있으니 <b>가게명의 일부만</b> 넣거나 시장·상점가명으로 다시 찾아 보세요. 공식 조회 사이트에서 한 번 더 확인할 수도 있어요.</div></div>`;
    }else{
      h+=`<div class="cnt">총 <b>${won(S.total)}곳</b> 중 ${won(S.rows.length)}곳 표시${S.dataDate?` <span class="mut">· 데이터 기준 ${esc(fmtDate(S.dataDate))}</span>`:''}</div>`;
      if(S.total>200)h+=`<div class="hint warn">같은 이름의 가게가 많아요. <b>시·도</b>를 고르거나 <b>시장·상점가명</b>을 함께 넣으면 더 정확해요.</div>`;
      h+=`<div>`+S.rows.map((r,i)=>`<div class="store tap" role="button" tabindex="0" onclick="openStore(${i})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openStore(${i})}"><span class="more">상세 ›</span><b>${esc(r.name||'(이름 없음)')}</b>
        <div class="sub">${esc(r.market||'소속 시장·상점가 정보 없음')} · ${esc((SIDO.find(x=>x[0]===r.sido)||[0,r.sido||'지역 정보 없음'])[1])}</div>
        <div class="sub">${r.item?esc(r.item):'취급품목 정보 없음'}</div>
        <span class="chip ${r.paper?'':'off'}">지류형 ${r.paper?'가능':'정보 없음'}</span><span class="chip ${r.digital?'':'off'}">디지털 ${r.digital?'가능':'정보 없음'}</span>${r.year?`<span class="chip off">${esc(r.year)}년 등록</span>`:''}</div>`).join('')+`</div>`;
      if(S.rows.length<S.total)h+=`<button class="ghost" style="width:100%;margin-bottom:12px" onclick="search(true)" ${S.busy?'disabled':''}>더 보기 (${won(S.total-S.rows.length)}곳 남음)</button>`;
      h+=`<div class="mut" style="margin:0 2px 12px">※ 이 목록에는 번지 주소가 없어(시·도와 시장·상점가까지만 제공) 같은 이름의 다른 가게와 헷갈릴 수 있어요. 실제 가맹 여부는 가게의 온누리 스티커나 공식 조회로 확인하세요.</div>`;
    }
  }
  return h;
}
function onnuriBox(ok){
  return`<div class="card"><h2>온누리상품권</h2><div class="sub0">전국 전통시장·상점가 등 온누리상품권 가맹점 · 소상공인시장진흥공단 공공데이터</div>
  ${keyHint()}
  <form onsubmit="return onSearch(event)" ${ok?'':'style="opacity:.55"'}>
    <label>가게명</label><input id="q_name" type="text" maxlength="30" autocomplete="off" placeholder="예: 약국, 정육점, 이름 일부" value="${esc(S.q.name)}" oninput="setQ('name',this.value)" ${ok?'':'disabled'}>
    <label>시·도</label>
    <div class="row"><select id="q_sido" class="grow" onchange="setQ('sido',this.value)" ${ok?'':'disabled'}><option value="">전국</option>${SIDO.map(([v,l])=>`<option value="${esc(v)}" ${S.q.sido===v?'selected':''}>${esc(l)}</option>`).join('')}</select>
      <button type="button" class="ghost" onclick="locate()" ${ok?'':'disabled'}>📍 현재 위치</button></div>
    <label>시장·상점가명 (선택)</label><input id="q_market" type="text" maxlength="30" autocomplete="off" placeholder="예: 남문시장, 골목형상점가" value="${esc(S.q.market)}" oninput="setQ('market',this.value)" ${ok?'':'disabled'}>
    <div style="margin-top:12px"><button type="submit" style="width:100%" ${ok&&!S.busy?'':'disabled'}>${S.busy?'조회 중…':'온누리 조회하기'}</button></div>
  </form>
  ${ok?locBox():''}
  ${resultsBox()}
  <div class="mut" style="margin-top:10px">결과는 공공데이터(소상공인시장진흥공단) 기준이며 폐업·변경은 반영이 늦을 수 있어요. 공식 사이트에서도 확인할 수 있어요.</div>
  <div class="row" style="margin-top:8px"><a class="btn ghost" href="https://www.onnuri.gift/" target="_blank" rel="noopener noreferrer">온누리 공식 사이트 ↗</a></div></div>`;
}
function render(){
  const ok=S.auth==='in'&&S.keyStatus==='ok';
  const tb=(id,label)=>`<button type="button" role="tab" id="tab_${id}" aria-selected="${S.view===id}" aria-controls="pnl_${id}" class="${S.view===id?'on':''}" onclick="setView('${id}')">${label}</button>`;
  document.getElementById('app').innerHTML=`<div class="hint">가려는 가게가 <b>온누리상품권</b>이나 <b>지역화폐</b> 가맹점인지 가게명으로 찾아봐요. 아래에서 상품권 종류를 고르세요.</div>
  ${authBox()}
  <div class="seg" role="tablist" aria-label="조회할 상품권 종류">${tb('onnuri','온누리상품권')}${tb('gg','경기지역화폐')}</div>
  <div role="tabpanel" id="pnl_onnuri" aria-labelledby="tab_onnuri" ${S.view==='onnuri'?'':'hidden'}>${onnuriBox(ok)}</div>
  <div role="tabpanel" id="pnl_gg" aria-labelledby="tab_gg" ${S.view==='gg'?'':'hidden'}>${ggBox()}</div>
  ${S.sel>=0&&S.rows[S.sel]?storePopup(S.rows[S.sel]):''}
  ${G.sel>=0&&G.all[G.sel]?ggPopup(G.all[G.sel]):''}`;
  if(S.sel>=0||G.sel>=0){const c=document.getElementById('pop_close');if(c&&c.focus)c.focus()}
}
render();
if(typeof window!=='undefined'&&window.addEventListener)window.addEventListener('keydown',e=>{if(e.key==='Escape'){closeStore();ggCloseStore()}});
initFirebase();
</script>
</body>
</html>
